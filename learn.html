<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Learn Finance – GramFin</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E💰%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-title="nav.learn">
  <header class="site-header" id="site-header"></header>

  <div class="page-head">
    <div class="container">
      <h1 data-i18n="learn.h1">📚 Learn Finance</h1>
      <p data-i18n="learn.sub">Short, simple lessons. Tap a topic to open it.</p>
    </div>
  </div>

  <main class="section">
    <div class="container">
      <!-- Lesson topics (rendered by learn.js) -->
      <div id="topics"></div>

      <h2 style="margin-top:44px" data-i18n="learn.quizH">🧠 Quick quiz</h2>
      <p class="lead" data-i18n="learn.quizSub">Test what you learned.</p>

      <!-- Quiz loading state -->
      <div class="db-spinner" id="quiz-spinner" hidden>
        <div class="spinner"></div>
        <span>Loading questions…</span>
      </div>

      <div class="card" id="quiz"></div>

      <!-- Score area -->
      <div id="score-area" style="margin-top:16px" hidden>
        <p id="score" style="font-weight:700;color:var(--cocoa);font-size:1.1rem"></p>

        <!-- Save confirmation (shown after score is saved to DB) -->
        <div class="score-save-badge" id="save-badge" hidden>
          <span class="score-save-icon">🎉</span>
          <div>
            <strong id="save-badge-title">Score saved!</strong>
            <span id="save-badge-msg"></span>
          </div>
        </div>

        <!-- Recent scores (shown for logged-in users) -->
        <div id="recent-scores-wrap" hidden style="margin-top:16px">
          <h3 style="font-size:1rem;color:var(--cocoa);margin-bottom:8px">📊 Your recent quiz scores</h3>
          <div id="recent-scores"></div>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/ui-strings.js"></script>
  <script src="js/content-translations.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/voice.js"></script>
  <script src="js/data.js"></script>
  <script src="js/db-quiz.js"></script>
  <script src="js/learn.js"></script>
</body>
</html>
